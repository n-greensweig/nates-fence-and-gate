version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - sudo apt-get update
        - sudo apt-get install -y libnss3
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
